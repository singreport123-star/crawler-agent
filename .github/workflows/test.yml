name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'TDCC or MOPS'
        required: true
        default: 'TDCC'
        type: choice
        options:
          - TDCC
          - MOPS
      stock:
        description: '股票代號 (TDCC用)'
        required: false
        default: '0050'
      date:
        description: '日期 (TDCC用, YYYYMMDD)'
        required: false
        default: '20250808'
      file_name:
        description: 'fileName (MOPS用, 例如 000930_1150422_114156.pdf)'
        required: false
        default: '000930_1150422_114156.pdf'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # ---------- contract tests ----------
      - name: Contract tests
        run: pytest tests/test_contracts.py -v

      # ---------- compiler tests ----------
      - name: Compiler tests (except hash match)
        run: pytest tests/test_compiler.py -v -k "not hash_matches_milestone1"

      - name: Compile TDCC context
        run: |
          python compiler/compiler.py \
            --context context/tdcc_context.json \
            --output  plans/tdcc_execution_plan_compiled.json

      - name: Compile MOPS context
        run: |
          python compiler/compiler.py \
            --context context/mops_context.json \
            --output  plans/mops_execution_plan_compiled.json

      # ---------- planner unit tests ----------
      - name: Planner unit tests
        run: pytest tests/test_planner.py -v -k "not e2e"

      # ---------- planner e2e ----------
      - name: Planner E2E (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest tests/test_planner.py::test_planner_e2e_tdcc -v

      # ---------- handler smoke ----------
      - name: Handler imports OK
        run: |
          python -c "
          from runtime import Runtime
          from runtime.action_handlers import HANDLERS
          assert set(HANDLERS)=={'http_request','extract_html','parse_table','save_csv'}
          print('handlers OK', list(HANDLERS))
          "

      # ---------- plan_hash ----------
      - name: plan_hash deterministic
        run: |
          python -c "
          import json, run
          p=run.load_json(run.PLAN_PATH)
          h1=run.compute_plan_hash(p)
          h2=run.compute_plan_hash(p)
          assert h1==h2
          print('plan_hash', h1)
          "

      # ---------- crawl（依 target 選擇）----------
      - name: Crawl TDCC
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'TDCC' }}
        run: |
          python run.py \
            --stock "${{ inputs.stock || '0050' }}" \
            --date  "${{ inputs.date  || '20250808' }}"

      - name: Crawl MOPS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'MOPS' }}
        run: |
          python run.py \
            --plan  plans/mops_execution_plan_compiled.json \
            --file_name "${{ inputs.file_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: crawler-output
          path: |
            data/
            plans/
          if-no-files-found: ignore
